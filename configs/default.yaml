# Pipeline configuration. All tunables live here — no magic numbers in code.

detection:
  # COCO-pretrained YOLO fails on nadir aerial vehicles (wrong viewpoint domain);
  # use VisDrone-finetuned weights. See docs/approach.md and README for download.
  model: models/yolov8s-visdrone.pt
  conf_threshold: 0.25
  iou_threshold: 0.50
  imgsz: 1280                # small aerial objects need higher inference resolution
  classes: [car, van, truck, bus]

tracking:
  tracker: bytetrack
  min_track_length: 10       # frames; drop spurious short tracks

camera:
  model: mavic_3t_wide       # see geo/camera.py registry

projection:
  ground_assumption: flat    # flat | dem
  altitude_source: rel_alt   # rel_alt | abs_alt
  crs_output: "EPSG:4326"    # WGS84 lon/lat

processing:
  # Centred moving-average window (in points) over each track's geo positions,
  # to suppress GNSS/pixel jitter. 1 disables smoothing; endpoints stay anchored.
  smoothing_window: 5
  # Drop tracks whose mean detection confidence is below this (a quality gate
  # beyond min_track_length). 0 disables it. Tracks with no confidence are kept.
  min_track_confidence: 0.3

io:
  frame_stride: 1            # process every Nth frame
  output_dir: outputs

visualization:
  map_html: map.html
  moving_min_displacement_m: 3.0   # below this net displacement a track is treated as parked
