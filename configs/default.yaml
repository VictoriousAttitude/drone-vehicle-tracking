# Pipeline configuration. All tunables live here — no magic numbers in code.

detection:
  # COCO-pretrained YOLO fails on nadir aerial vehicles (wrong viewpoint domain);
  # use VisDrone-finetuned weights. See docs/approach.md and README for download.
  model: models/yolov8s-visdrone.pt
  conf_threshold: 0.25
  iou_threshold: 0.50
  imgsz: 1280                # small aerial objects need higher inference resolution
  classes: [car, van, truck, bus]

tracking:
  tracker: bytetrack
  min_track_length: 10       # frames; drop spurious short tracks

camera:
  model: mavic_3t_wide       # see geo/camera.py registry

projection:
  ground_assumption: flat    # flat | dem
  altitude_source: rel_alt   # rel_alt | abs_alt
  crs_output: "EPSG:4326"    # WGS84 lon/lat

processing:
  # Centred moving-average window (in points) over each track's geo positions,
  # to suppress GNSS/pixel jitter. 1 disables smoothing; endpoints stay anchored.
  smoothing_window: 5
  # Drop tracks whose mean detection confidence is below this (a quality gate
  # beyond min_track_length). 0 disables it. Tracks with no confidence are kept.
  min_track_confidence: 0.3
  # Visual ego-motion stabilization: register consecutive frames (needs the [cv]
  # extra) and blend the measured motion with the GNSS/yaw telemetry through a
  # complementary filter, suppressing high-frequency position jitter while the
  # absolute datum stays GNSS-anchored. See docs/approach.md.
  stabilize: true
  stabilization_window: 61   # residual moving-average window in processed frames
                             # (~2 s at 30 fps); <= 1 disables the blend

io:
  frame_stride: 1            # process every Nth frame
  output_dir: outputs

visualization:
  map_html: map.html
  moving_min_displacement_m: 3.0   # below this net displacement a track is treated as parked

export:
  # Cursor-on-Target (CoT) output for TAK clients/servers, written with `dvt --cot`.
  cot_type: a-u-G            # MIL-STD-2525 CoT type: atom / unknown affiliation / Ground
  cot_stale_seconds: 60      # how long each emitted CoT event stays valid
  # GNSS floor for the self-reported horizontal accuracy. GNSS-bound without RTK;
  # the geometry terms below are combined with it per point — see docs/approach.md.
  position_error_m: 3.0

accuracy:
  # Sensor-uncertainty coefficients for the per-point self-reported accuracy
  # (surfaced as CoT `ce`, GeoJSON `position_error_m` and the map popup). They are
  # combined in quadrature with the GNSS floor above, scaled by each pixel's radial
  # ground offset and altitude. See the error budget in docs/approach.md.
  tilt_error_deg: 0.1            # residual gimbal pitch/roll after stabilisation
  altitude_relative_error: 0.01  # 1% altitude uncertainty
  focal_relative_error: 0.01     # 1% focal-length / HFOV miscalibration
  yaw_error_deg: 0.5             # heading (yaw) uncertainty
